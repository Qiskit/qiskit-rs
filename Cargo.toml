[package]
name = "qiskit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust bindings to libqiskit"
readme = "README.md"
keywords = ["quantum", "qiskit"]

[workspace]
members = ["qiskit-sys", "qiskit-sys-bindgen"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Matthew Treinish <mtreinish@kortar.org", "Emil Kovacev <emilkovacev@gmail.com>"]
license = "Apache-2.0"
version = "0.0.0"

[workspace.dependencies]
bytemuck = "1.25"
bitfield-struct = "0.13.0"
indexmap.version = "2.10.0"
hashbrown.version = "0.15.5"
num-bigint = "0.4"
num-complex = "0.4"
nalgebra = "0.35"
faer = "0.24"
numpy = "0.29"
ndarray = "0.17"
smallvec = "1.15"
thiserror = "2.0"
rustworkx-core = "0.18"
fixedbitset = "0.5.7"
approx = "0.5"
itertools = "0.15.0"
foldhash = "0.2.0"
rayon = "1.12"
nom = "8.0"
nom-unicode = "0.4"
nom-language = "0.1"
rand = "0.10"
rand_pcg = "0.10"
rand_distr = "0.6"
num-traits = "0.2"
uuid = { version = "1.23", features = ["v4", "fast-rng"], default-features = false }
anyhow = "1.0"
binrw = "0.15"
cbindgen = "0.29.4"
mimalloc = "0.1.52"
npyz = {version = "0.9.1", features = ["complex"]}

# Most of the crates don't need the feature `extension-module`, since only `qiskit-pyext` builds an
# actual C extension (the feature disables linking in `libpython`, which is forbidden in Python
# distributions).  We only activate that feature when building the C extension module; we still need
# it disabled for Rust-only tests to avoid linker errors with it not being loaded.  See
# https://pyo3.rs/main/features#extension-module for more.
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }

qiskit-bindgen = { path = "qiskit-sys-bindgen/qiskit/crates/bindgen" }
qiskit-cext-vtable = { path = "qiskit-sys-bindgen/qiskit/crates/cext-vtable" }
qiskit-cext = { path = "qiskit-sys-bindgen/qiskit/crates/cext" }
qiskit-circuit = { path = "qiskit-sys-bindgen/qiskit/crates/circuit" }
qiskit-circuit-library = { path = "qiskit-sys-bindgen/qiskit/crates/circuit_library" }
qiskit-quantum-info = { path = "qiskit-sys-bindgen/qiskit/crates/quantum_info" }
qiskit-transpiler = { path = "qiskit-sys-bindgen/qiskit/crates/transpiler" }
qiskit-util = { path = "qiskit-sys-bindgen/qiskit/crates/util" }
qiskit-synthesis = { path = "qiskit-sys-bindgen/qiskit/crates/synthesis" }

[lib]
name = "qiskit_rs"
path = "src/lib.rs"
test = true
doctest = true

[dependencies]
qiskit-sys = { path = "qiskit-sys", version="2.4.0" }

[workspace.lints.clippy]
# The lint forbids things like `if a < b {} else if a == b {}`, and suggests matching on `a.cmp(&b)`
# which uses the `::std::cmp::Ordering` enum as a return.  Both styles are acceptable, and the `if`
# chain can be more legible to people.
comparison-chain = "allow"
# Forbid `{,e}print{,ln}!` calls.  These can be allowed locally if absolutely required, but the
# vast majority of these are debug statements that we forget about.
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
# In Rust 2021, the bodies of `unsafe fn` may use `unsafe` functions themselves without marking
# them.  This is an overload of the word: `unsafe fn` is documenting something for the caller, but
# that doesn't mean the entire function body is unsafe.  Denying this lint (which becomes
# warn-by-default in Rust 2024) means `unsafe fn` bodies still must use `unsafe {}` like normal.
unsafe_op_in_unsafe_fn = "deny"