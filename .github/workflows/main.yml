---
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Rust fmt
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Build qiskit-pyo3-ffi
      run: cargo xtask generate-pyo3
    - name: Install Qiskit and run qiskit-pyo3-ffi tests
      run: |
        qiskit_version=$(python -c "import tomllib; print(tomllib.load(open('qiskit/Cargo.toml','rb'))['workspace']['package']['version'])")
        pip install qiskit==$qiskit_version
        cargo test --manifest-path qiskit-pyo3-ffi-tests/Cargo.toml
    - name: Build docs
      run: cargo doc --all-features --workspace
    - name: upload docs build
      uses: actions/upload-artifact@v5
      with:
        name: docs
        path: |
          target/doc/qiskit_rs
          target/doc/qiskit_sys
